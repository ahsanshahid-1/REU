<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | REU Applications</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/theme.css?v=3">
<link rel="stylesheet" href="/styles/site.css?v=3">
</head>
<body>
<main id="main">
<section>
  <div class="wrap" style="max-width:960px">
    <span class="eyebrow">Program staff only</span>
    <h1 style="font-size:32px;margin-bottom:16px">Application review</h1>

    <div id="login" class="card" style="max-width:460px">
      <label for="token">Admin token</label>
      <input type="text" id="token" autocomplete="off" placeholder="Printed in the server console on startup">
      <button class="btn btn-primary" id="load-btn" style="margin-top:14px">Load applications</button>
      <div class="form-status" id="login-status"></div>
    </div>

    <div id="panel" hidden>
      <div class="grid grid-3" id="stat-cards" style="margin:20px 0;gap:14px">
        <div class="card" style="text-align:center">
          <div class="mono" id="stat-accounts" style="font-size:34px;font-weight:700;color:var(--fg-primary)">0</div>
          <div style="color:var(--fg-muted);font-size:13.5px;margin-top:4px">Accounts signed up</div>
          <div id="stat-verified" style="color:var(--fg-secondary);font-size:12.5px;margin-top:2px"></div>
        </div>
        <div class="card" style="text-align:center">
          <div class="mono" id="stat-apps" style="font-size:34px;font-weight:700;color:var(--fg-primary)">0</div>
          <div style="color:var(--fg-muted);font-size:13.5px;margin-top:4px">Applications submitted</div>
        </div>
        <div class="card" style="text-align:center">
          <div class="mono" id="stat-mix" style="font-size:20px;font-weight:700;color:var(--fg-primary)">0 / 0</div>
          <div style="color:var(--fg-muted);font-size:13.5px;margin-top:4px">UA Little Rock / external</div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0;flex-wrap:wrap;gap:12px">
        <p><strong id="count">0</strong> applications &middot; <span id="mix" class="mono"></span></p>
        <button class="btn btn-secondary" id="csv-btn">Download CSV</button>
      </div>
      <div style="overflow-x:auto">
        <table id="tbl">
          <thead><tr>
            <th>Conf #</th><th>Submitted</th><th>Name</th><th>Affil.</th><th>Institution</th><th>Type</th><th>Year</th><th>Theme</th><th>Transcript</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</section>
</main>
<script>
(function(){
  var token = '';
  function api(path){
    return fetch(path, { headers: { Authorization: 'Bearer ' + token } });
  }
  document.getElementById('load-btn').addEventListener('click', function(){
    token = document.getElementById('token').value.trim();
    var st = document.getElementById('login-status');
    st.className = 'form-status';
    api('/api/admin/applications').then(function(r){
      if (!r.ok) throw new Error(r.status === 401 ? 'Invalid token' : 'Request failed');
      return r.json();
    }).then(function(data){
      document.getElementById('login').hidden = true;
      document.getElementById('panel').hidden = false;
      document.getElementById('count').textContent = data.count;
      document.getElementById('mix').textContent = data.internal + ' UALR / ' + data.external + ' external';
      // Load account sign-up statistics for the summary cards.
      api('/api/admin/stats').then(function(r){ return r.ok ? r.json() : null; }).then(function(s){
        if (!s) return;
        document.getElementById('stat-accounts').textContent = s.accounts;
        document.getElementById('stat-verified').textContent = s.verified + ' verified · ' + s.unverified + ' pending';
        document.getElementById('stat-apps').textContent = s.applications;
        document.getElementById('stat-mix').textContent = s.internal + ' / ' + s.external;
      }).catch(function(){ /* stats are supplementary; ignore errors */ });
      var tb = document.querySelector('#tbl tbody');
      tb.innerHTML = '';
      data.applications.forEach(function(a){
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="mono">' + a.confirmation + '</td>' +
          '<td>' + a.submitted_at.slice(0,10) + '</td>' +
          '<td>' + a.first_name + ' ' + a.last_name + '<br><small>' + a.email + '</small></td>' +
          '<td>' + (a.affiliation === 'ualr' ? 'UALR' : 'ext') + '</td>' +
          '<td>' + a.institution + '</td>' +
          '<td>' + a.institution_type.replace(/_/g,' ') + '</td>' +
          '<td>' + a.year + '</td>' +
          '<td>' + a.theme1 + '</td>' +
          '<td><a href="#" data-id="' + a.id + '">PDF</a></td>';
        tb.appendChild(tr);
      });
      tb.addEventListener('click', function(e){
        var id = e.target.getAttribute('data-id');
        if (!id) return;
        e.preventDefault();
        api('/api/admin/transcript/' + id).then(function(r){ return r.blob(); })
          .then(function(b){
            var url = URL.createObjectURL(b);
            var a = document.createElement('a');
            a.href = url; a.download = 'transcript-' + id + '.pdf'; a.click();
            URL.revokeObjectURL(url);
          });
      });
    }).catch(function(err){
      st.className = 'form-status bad';
      st.textContent = err.message;
    });
  });
  document.getElementById('csv-btn').addEventListener('click', function(){
    api('/api/admin/applications.csv').then(function(r){ return r.blob(); })
      .then(function(b){
        var url = URL.createObjectURL(b);
        var a = document.createElement('a');
        a.href = url; a.download = 'reu-applications.csv'; a.click();
        URL.revokeObjectURL(url);
      });
  });
})();
</script>
</body>
</html>
