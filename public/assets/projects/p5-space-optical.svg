<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Robust learned space-optical communications: a satellite sending an optical beam through atmospheric turbulence to a ground station, with a received signal constellation.">
  <defs>
    <linearGradient id="p5bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A0F16"/><stop offset=".5" stop-color="#4C1A27"/><stop offset="1" stop-color="#6E2639"/>
    </linearGradient>
    <linearGradient id="p5beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFBF00" stop-opacity=".95"/><stop offset="1" stop-color="#FFBF00" stop-opacity=".15"/>
    </linearGradient>
    <pattern id="p5dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="800" height="360" fill="url(#p5bg)"/>
  <rect width="800" height="360" fill="url(#p5dots)"/>

  <!-- stars -->
  <g fill="#FFE579">
    <circle cx="120" cy="60" r="2"/><circle cx="200" cy="110" r="1.5"/><circle cx="300" cy="50" r="2"/><circle cx="520" cy="70" r="1.5"/><circle cx="470" cy="130" r="2"/><circle cx="90" cy="150" r="1.5"/>
  </g>

  <!-- optical beam -->
  <path d="M188 96 L620 300 L648 268 L214 70 Z" fill="url(#p5beam)"/>
  <!-- turbulence bands crossing the beam -->
  <g stroke="#EED9DF" stroke-width="2" fill="none" opacity=".45">
    <path d="M300 130 q20 -12 40 0 t40 0 t40 0"/>
    <path d="M360 175 q20 -12 40 0 t40 0 t40 0"/>
    <path d="M420 220 q20 -12 40 0 t40 0 t40 0"/>
  </g>

  <!-- satellite -->
  <g transform="translate(190 88)">
    <rect x="-22" y="-16" width="44" height="32" rx="6" fill="#2A0F16" stroke="#FFBF00" stroke-width="2.5"/>
    <g fill="#98344F" stroke="#EED9DF" stroke-width="1.5">
      <rect x="-74" y="-14" width="44" height="28" rx="3"/><rect x="30" y="-14" width="44" height="28" rx="3"/>
    </g>
    <line x1="-52" y1="-14" x2="-52" y2="14" stroke="#EED9DF" stroke-width="1"/><line x1="52" y1="-14" x2="52" y2="14" stroke="#EED9DF" stroke-width="1"/>
    <circle cx="0" cy="22" r="5" fill="#FFBF00"/>
  </g>

  <!-- ground station dish -->
  <g transform="translate(628 292)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#EED9DF" stroke-width="4"/>
    <path d="M-40 -18 A 44 44 0 0 1 40 -18 Z" fill="#2A0F16" stroke="#FFBF00" stroke-width="2.5" transform="rotate(-24)"/>
    <circle cx="0" cy="0" r="5" fill="#FFBF00"/>
    <rect x="-26" y="40" width="52" height="10" rx="3" fill="#98344F" stroke="#EED9DF" stroke-width="1.5"/>
  </g>

  <!-- received signal constellation -->
  <g transform="translate(690 110)">
    <rect x="-58" y="-58" width="116" height="116" rx="10" fill="#2A0F16" stroke="#EED9DF" stroke-width="1.5" opacity=".95"/>
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#EED9DF" stroke-width="1" opacity=".5"/>
    <line x1="0" y1="-46" x2="0" y2="46" stroke="#EED9DF" stroke-width="1" opacity=".5"/>
    <g fill="#FFBF00">
      <circle cx="-24" cy="-22" r="4"/><circle cx="22" cy="-24" r="4"/><circle cx="-22" cy="24" r="4"/><circle cx="24" cy="22" r="4"/>
      <circle cx="-26" cy="20" r="4"/><circle cx="20" cy="-20" r="4"/>
    </g>
    <g fill="#EED9DF" opacity=".7"><circle cx="-18" cy="-26" r="2"/><circle cx="27" cy="-19" r="2"/><circle cx="-27" cy="26" r="2"/></g>
  </g>

  <text x="40" y="336" font-family="'IBM Plex Mono',monospace" font-size="15" fill="#EED9DF" opacity=".85">05 &#183; Robust learned space-optical comms</text>
</svg>
