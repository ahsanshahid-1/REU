<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Federated learning at the edge: edge devices sending compressed model updates to a central model.">
  <defs>
    <linearGradient id="p1bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C1A27"/><stop offset=".55" stop-color="#6E2639"/><stop offset="1" stop-color="#98344F"/>
    </linearGradient>
    <radialGradient id="p1glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFBF00" stop-opacity=".9"/><stop offset="1" stop-color="#FFBF00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p1dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="800" height="360" fill="url(#p1bg)"/>
  <rect width="800" height="360" fill="url(#p1dots)"/>
  <circle cx="400" cy="180" r="150" fill="url(#p1glow)" opacity=".5"/>

  <!-- links from edge nodes to hub -->
  <g stroke="#EED9DF" stroke-width="2" opacity=".55">
    <line x1="400" y1="180" x2="150" y2="90"/>
    <line x1="400" y1="180" x2="140" y2="270"/>
    <line x1="400" y1="180" x2="650" y2="95"/>
    <line x1="400" y1="180" x2="660" y2="275"/>
    <line x1="400" y1="180" x2="400" y2="40"/>
    <line x1="400" y1="180" x2="400" y2="325"/>
  </g>

  <!-- compressed update packets travelling inward -->
  <g fill="#FFBF00">
    <rect x="248" y="130" width="12" height="12" rx="2" transform="rotate(28 254 136)"/>
    <rect x="250" y="222" width="12" height="12" rx="2" transform="rotate(-25 256 228)"/>
    <rect x="536" y="132" width="12" height="12" rx="2" transform="rotate(-24 542 138)"/>
    <rect x="540" y="224" width="12" height="12" rx="2" transform="rotate(26 546 230)"/>
  </g>

  <!-- edge devices -->
  <g>
    <g transform="translate(150 90)"><rect x="-34" y="-24" width="68" height="48" rx="8" fill="#2E1119" stroke="#EED9DF" stroke-width="2"/><rect x="-24" y="-14" width="48" height="28" rx="3" fill="#98344F"/></g>
    <g transform="translate(140 270)"><rect x="-34" y="-24" width="68" height="48" rx="8" fill="#2E1119" stroke="#EED9DF" stroke-width="2"/><rect x="-24" y="-14" width="48" height="28" rx="3" fill="#98344F"/></g>
    <g transform="translate(650 95)"><rect x="-34" y="-24" width="68" height="48" rx="8" fill="#2E1119" stroke="#EED9DF" stroke-width="2"/><rect x="-24" y="-14" width="48" height="28" rx="3" fill="#98344F"/></g>
    <g transform="translate(660 275)"><rect x="-34" y="-24" width="68" height="48" rx="8" fill="#2E1119" stroke="#EED9DF" stroke-width="2"/><rect x="-24" y="-14" width="48" height="28" rx="3" fill="#98344F"/></g>
    <g transform="translate(400 40)"><circle r="18" fill="#2E1119" stroke="#EED9DF" stroke-width="2"/><circle r="7" fill="#FFBF00"/></g>
    <g transform="translate(400 325)"><circle r="18" fill="#2E1119" stroke="#EED9DF" stroke-width="2"/><circle r="7" fill="#FFBF00"/></g>
  </g>

  <!-- central global model -->
  <g transform="translate(400 180)">
    <circle r="58" fill="#2A0F16" stroke="#FFBF00" stroke-width="2.5"/>
    <circle r="58" fill="none" stroke="#ffffff" stroke-width="1" opacity=".25"/>
    <g stroke="#EED9DF" stroke-width="2" fill="none" opacity=".9">
      <circle r="10" cx="-18" cy="-8"/><circle r="10" cx="18" cy="-8"/><circle r="10" cx="0" cy="20"/>
      <line x1="-18" y1="-8" x2="18" y2="-8"/><line x1="-18" y1="-8" x2="0" y2="20"/><line x1="18" y1="-8" x2="0" y2="20"/>
    </g>
  </g>

  <text x="40" y="336" font-family="'IBM Plex Mono',monospace" font-size="15" fill="#EED9DF" opacity=".85">01 &#183; Federated adaptation at the edge</text>
</svg>
