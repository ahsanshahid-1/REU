<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Efficient multimodal AI deployed from GPU to edge to FPGA, shown as a processor die with a neural network and a deployment pipeline.">
  <defs>
    <linearGradient id="p2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C1A27"/><stop offset=".55" stop-color="#6E2639"/><stop offset="1" stop-color="#98344F"/>
    </linearGradient>
    <pattern id="p2dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="800" height="360" fill="url(#p2bg)"/>
  <rect width="800" height="360" fill="url(#p2dots)"/>

  <!-- processor die -->
  <g transform="translate(250 175)">
    <g stroke="#EED9DF" stroke-width="2" opacity=".7">
      <line x1="-84" y1="-40" x2="-108" y2="-40"/><line x1="-84" y1="-14" x2="-108" y2="-14"/><line x1="-84" y1="12" x2="-108" y2="12"/><line x1="-84" y1="38" x2="-108" y2="38"/>
      <line x1="84" y1="-40" x2="108" y2="-40"/><line x1="84" y1="-14" x2="108" y2="-14"/><line x1="84" y1="12" x2="108" y2="12"/><line x1="84" y1="38" x2="108" y2="38"/>
      <line x1="-40" y1="-84" x2="-40" y2="-108"/><line x1="-14" y1="-84" x2="-14" y2="-108"/><line x1="12" y1="-84" x2="12" y2="-108"/><line x1="38" y1="-84" x2="38" y2="-108"/>
      <line x1="-40" y1="84" x2="-40" y2="108"/><line x1="-14" y1="84" x2="-14" y2="108"/><line x1="12" y1="84" x2="12" y2="108"/><line x1="38" y1="84" x2="38" y2="108"/>
    </g>
    <rect x="-84" y="-84" width="168" height="168" rx="14" fill="#2A0F16" stroke="#FFBF00" stroke-width="2.5"/>
    <!-- neural net inside -->
    <g opacity=".95">
      <g stroke="#EED9DF" stroke-width="1.4" opacity=".5">
        <line x1="-52" y1="-40" x2="0" y2="-48"/><line x1="-52" y1="-40" x2="0" y2="0"/><line x1="-52" y1="0" x2="0" y2="-48"/><line x1="-52" y1="0" x2="0" y2="0"/><line x1="-52" y1="0" x2="0" y2="48"/><line x1="-52" y1="40" x2="0" y2="0"/><line x1="-52" y1="40" x2="0" y2="48"/>
        <line x1="0" y1="-48" x2="52" y2="-20"/><line x1="0" y1="0" x2="52" y2="-20"/><line x1="0" y1="0" x2="52" y2="24"/><line x1="0" y1="48" x2="52" y2="24"/>
      </g>
      <g fill="#98344F" stroke="#EED9DF" stroke-width="1.5">
        <circle cx="-52" cy="-40" r="7"/><circle cx="-52" cy="0" r="7"/><circle cx="-52" cy="40" r="7"/>
        <circle cx="0" cy="-48" r="7"/><circle cx="0" cy="0" r="7"/><circle cx="0" cy="48" r="7"/>
      </g>
      <g fill="#FFBF00" stroke="#2A0F16" stroke-width="1.5">
        <circle cx="52" cy="-20" r="8"/><circle cx="52" cy="24" r="8"/>
      </g>
    </g>
  </g>

  <!-- multimodal inputs -->
  <g transform="translate(250 60)" fill="#EED9DF" opacity=".9">
    <rect x="-22" y="-16" width="44" height="32" rx="4" fill="none" stroke="#EED9DF" stroke-width="2"/>
    <circle cx="-8" cy="-2" r="4"/><path d="M-18 12 L-4 -2 L6 8 L14 0 L18 12 Z"/>
  </g>

  <!-- deployment pipeline: GPU -> EDGE -> FPGA -->
  <g transform="translate(560 0)">
    <g stroke="#FFBF00" stroke-width="2.5" fill="none" marker-end="url(#p2arrow)">
      <line x1="0" y1="95" x2="0" y2="135"/><line x1="0" y1="200" x2="0" y2="240"/>
    </g>
    <defs>
      <marker id="p2arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#FFBF00"/></marker>
    </defs>
    <!-- GPU -->
    <g transform="translate(0 65)"><rect x="-70" y="-30" width="140" height="60" rx="9" fill="#2A0F16" stroke="#EED9DF" stroke-width="2"/><text x="0" y="6" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="18" fill="#EED9DF">GPU</text></g>
    <!-- EDGE -->
    <g transform="translate(0 170)"><rect x="-70" y="-30" width="140" height="60" rx="9" fill="#2A0F16" stroke="#EED9DF" stroke-width="2"/><text x="0" y="6" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="18" fill="#EED9DF">EDGE</text></g>
    <!-- FPGA grid -->
    <g transform="translate(0 275)"><rect x="-70" y="-30" width="140" height="60" rx="9" fill="#2A0F16" stroke="#FFBF00" stroke-width="2"/>
      <g fill="#98344F"><rect x="-52" y="-14" width="12" height="12"/><rect x="-34" y="-14" width="12" height="12"/><rect x="-16" y="-14" width="12" height="12"/><rect x="-52" y="2" width="12" height="12"/><rect x="-34" y="2" width="12" height="12"/><rect x="-16" y="2" width="12" height="12"/></g>
      <text x="26" y="6" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="16" fill="#EED9DF">FPGA</text></g>
  </g>

  <text x="40" y="336" font-family="'IBM Plex Mono',monospace" font-size="15" fill="#EED9DF" opacity=".85">02 &#183; Efficient multimodal AI, GPU to edge</text>
</svg>
