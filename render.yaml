# One-click Render blueprint. In the Render dashboard: New > Blueprint,
# point it at your repo, and this provisions the service + disk.
services:
  - type: web
    name: reu-site
    runtime: node
    plan: starter            # $7/mo: always-on + persistent disk. Use 'free' only for a throwaway demo (no disk, sleeps).
    # Clean install so the native better-sqlite3 binary is always rebuilt for the
    # current Node version (avoids stale-cache NODE_MODULE_VERSION mismatches).
    buildCommand: rm -rf node_modules && npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION    # keep build + runtime on the SAME Node major (24) so the compiled binary matches
        value: "24"
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        generateValue: true   # Render generates a strong secret; view it in the dashboard.
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: reu-data
      mountPath: /app/data    # SQLite db + transcript PDFs persist here.
      sizeGB: 1
